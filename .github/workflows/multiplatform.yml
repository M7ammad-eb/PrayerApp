name: Salati multiplatform
on:
  push:
    branches: [ios]
    paths-ignore: [docs/**, .github/workflows/baseline-audit.yml]
  pull_request:
    branches: [ios]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: salati-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Shared parity, Android tests and APK
        run: bash ./gradlew :shared:jvmTest :app:testDebugUnitTest :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-and-shared-results
          path: |
            app/build/reports/tests
            app/build/test-results/testDebugUnitTest
            shared/build/reports/tests
            app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Xcode
        run: xcodebuild -version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-2.4.10-xcode26.4.1
      - run: brew install xcodegen
      - name: Build Kotlin framework and reproducible Xcode project
        run: bash tools/ios/build.sh
      - name: Compile unsigned app, extension and tests
        timeout-minutes: 12
        run: xcodebuild -project iosApp/Salati.xcodeproj -scheme Salati -destination 'generic/platform=iOS Simulator' -derivedDataPath iosApp/.derivedData CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build-for-testing
      - name: Select and boot compatible simulator
        timeout-minutes: 5
        run: |
          xcrun simctl list devices available
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS-26-4" in k for v in vs if "iPhone" in v["name"]))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Native shared-core tests
        timeout-minutes: 10
        run: bash ./gradlew :shared:iosSimulatorArm64Test --device "$SIMULATOR_ID" --console=plain
      - name: Unsigned SwiftUI build and tests
        timeout-minutes: 15
        run: |
          xcodebuild -project iosApp/Salati.xcodeproj -scheme Salati -destination "id=$SIMULATOR_ID" -derivedDataPath iosApp/.derivedData -resultBundlePath iosApp/TestResults.xcresult CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO test-without-building
      - name: Export runtime screenshots and diagnostic attachments
        if: always()
        continue-on-error: true
        run: |
          if [[ -d iosApp/TestResults.xcresult ]]; then
            xcrun xcresulttool export attachments --path iosApp/TestResults.xcresult --output-path iosApp/screenshots
          fi
      - name: Capture running simulator
        if: success()
        run: |
          xcrun simctl terminate "$SIMULATOR_ID" com.salati.prayertimes.ios || true
          xcrun simctl launch "$SIMULATOR_ID" com.salati.prayertimes.ios
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot iosApp/simulator-home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-results
          path: |
            iosApp/TestResults.xcresult
            iosApp/*.png
            iosApp/screenshots
            shared/build/reports/tests
