name: Salati multiplatform
on:
  push:
    branches: [ios]
    paths-ignore: [docs/**, .github/workflows/baseline-audit.yml]
  pull_request:
    branches: [ios]
  workflow_dispatch:
    inputs:
      native_only:
        description: 'Validate an iOS-only repair after unchanged shared/Android sources already passed'
        type: boolean
        default: false
      activity_only:
        description: 'Recheck widget and actual Activity presentation after a presentation-only repair'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: salati-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.native_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Shared parity, Android tests and APK
        run: bash ./gradlew :shared:jvmTest :app:testDebugUnitTest :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-and-shared-results
          path: |
            app/build/reports/tests
            app/build/test-results/testDebugUnitTest
            shared/build/reports/tests
            app/build/outputs/apk/debug/*.apk
  ios:
    needs: android
    if: always() && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: macos-26
    timeout-minutes: 80
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Xcode
        run: xcodebuild -version
      # Start the cold simulator while Gradle/Xcode compile independent build products.
      - name: Start compatible simulator
        timeout-minutes: 3
        run: |
          xcrun simctl list devices available
          read -r DEVICE SIMULATOR_STATE <<< "$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); vs=[v for k,vs in d["devices"].items() if "iOS-26-4" in k for v in vs if "iPhone" in v["name"]]; v=next((v for v in vs if v["name"] == "iPhone 17 Pro Max"),vs[0]); print(v["udid"],v["state"])')"
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          if [[ "$SIMULATOR_STATE" != "Booted" ]]; then xcrun simctl boot "$DEVICE"; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-2.4.10-xcode26.4.1
      - run: brew install xcodegen
      - name: Build Kotlin framework and reproducible Xcode project
        run: bash tools/ios/build.sh
      - name: Compile unsigned app, extension and tests
        timeout-minutes: 12
        run: xcodebuild -project iosApp/Salati.xcodeproj -scheme Salati -destination 'generic/platform=iOS Simulator' -derivedDataPath iosApp/.derivedData CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build-for-testing
      - name: Apply certificate-free simulator App Group entitlements
        run: bash tools/ios/sign_simulator.sh
      - name: Wait for compatible simulator
        timeout-minutes: 10
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Native shared-core tests
        if: inputs.activity_only != true
        timeout-minutes: 10
        run: bash ./gradlew :shared:iosSimulatorArm64Test --device "$SIMULATOR_ID" --console=plain
      - name: Simulator XCTest and UI tests
        timeout-minutes: 32
        run: |
          SELECTION=()
          if [[ '${{ inputs.activity_only }}' == 'true' ]]; then
            SELECTION=(-only-testing:SalatiUITests/SalatiUITests/testWidgetAndActivityRendererPreviews)
          fi
          xcodebuild -project iosApp/Salati.xcodeproj -scheme Salati -destination "id=$SIMULATOR_ID" -derivedDataPath iosApp/.derivedData -resultBundlePath iosApp/TestResults.xcresult CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO "${SELECTION[@]}" test-without-building
      - name: Export runtime screenshots and diagnostic attachments
        if: always()
        continue-on-error: true
        run: |
          if [[ -d iosApp/TestResults.xcresult ]]; then
            xcrun xcresulttool export attachments --path iosApp/TestResults.xcresult --output-path iosApp/screenshots
          fi
      - name: Select compact simulator after main device finishes
        if: inputs.activity_only != true
        timeout-minutes: 12
        run: |
          xcrun simctl shutdown "$SIMULATOR_ID"
          SMALL=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); vs=[v for k,vs in d["devices"].items() if "iOS-26-4" in k for v in vs if "iPhone" in v["name"]]; names=["iPhone SE (3rd generation)","iPhone 17e","iPhone 16e","iPhone 17"]; print(next((v["udid"] for name in names for v in vs if v["name"]==name),vs[-1]["udid"]))')
          echo "COMPACT_SIMULATOR_ID=$SMALL" >> "$GITHUB_ENV"
          xcrun simctl boot "$SMALL"
          xcrun simctl bootstatus "$SMALL" -b
      - name: Compact iPhone and large-text UI checks
        if: inputs.activity_only != true
        timeout-minutes: 15
        run: |
          xcodebuild -project iosApp/Salati.xcodeproj -scheme Salati -destination "id=$COMPACT_SIMULATOR_ID" -derivedDataPath iosApp/.derivedData -resultBundlePath iosApp/CompactTestResults.xcresult CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO -only-testing:SalatiUITests/SalatiUITests/testChooseOfflineCityAndNavigate -only-testing:SalatiUITests/SalatiUITests/testAccessibilityCalendarAndHome -only-testing:SalatiUITests/SalatiUITests/testCompactWidgetLayouts test-without-building
      - name: Export compact screenshots
        if: always() && inputs.activity_only != true
        continue-on-error: true
        run: |
          if [[ -d iosApp/CompactTestResults.xcresult ]]; then
            xcrun xcresulttool export attachments --path iosApp/CompactTestResults.xcresult --output-path iosApp/screenshots-compact
          fi
      - name: Capture running simulator
        if: success() && inputs.activity_only != true
        run: |
          xcrun simctl terminate "$COMPACT_SIMULATOR_ID" com.salati.prayertimes.ios || true
          xcrun simctl launch "$COMPACT_SIMULATOR_ID" com.salati.prayertimes.ios
          sleep 3
          xcrun simctl io "$COMPACT_SIMULATOR_ID" screenshot iosApp/simulator-home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-results
          path: |
            iosApp/TestResults.xcresult
            iosApp/CompactTestResults.xcresult
            iosApp/*.png
            iosApp/screenshots
            iosApp/screenshots-compact
            shared/build/reports/tests
